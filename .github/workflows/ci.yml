name: Java CI with Maven and Security Scans

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./secure-rest-api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: securedb
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Run SpotBugs (SAST)
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:check

      - name: Run OWASP Dependency-Check(SCA)
        run: mvn org.owasp:dependency-check-maven:check -DnvdApiDelay=4000 -DfailBuildOnCVSS=7

      - name: Upload SCA HTML Report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: OWASP-Dependency-Check-Report
          path: ./secure-rest-api/target/dependency-check-report.html

      - name: Upload SpotBugs Reports(SARIF-XML)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: SpotBugs-Reports
          path: |
            ./secure-rest-api/target/spotbugsXml.xml
            ./secure-rest-api/target/spotbugsSarif.json
