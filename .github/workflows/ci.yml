name: Java CI with Maven and Security Scans

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Указываем, что все команды запускаются в папке secure-rest-api
    defaults:
      run:
        working-directory: ./secure-rest-api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: securedb
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (with tests)
        run: mvn -B clean package

      - name: Run SpotBugs (SAST)
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:4.8.6.2:check

      - name: Run OWASP Dependency-Check (SCA)
        run: mvn org.owasp:dependency-check-maven:check -DnvdApiDelay=4000 -DfailBuildOnCVSS=10
        continue-on-error: true